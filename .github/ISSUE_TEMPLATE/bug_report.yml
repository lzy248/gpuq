name: Bug report / 错误报告
description: Report reproducible gpuq behavior / 报告可复现问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve gpuq. 感谢帮助改进 gpuq。
  - type: input
    id: version
    attributes:
      label: gpuq version / 版本
      placeholder: gpuq 0.3.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / 复现步骤
      description: Remove secrets and private paths before posting. 发布前请移除密钥和隐私路径。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Linux, Python, NVIDIA driver, GPU model, installation method.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / 相关日志
      render: shell

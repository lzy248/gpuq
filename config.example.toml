[gpuq]
# Project admission: fair (default) or legacy fifo. Counts tasks, not GPUs.
scheduling_mode = "fair"
max_running_jobs = 0  # 0 = no total cap; use 2 for A+B across competing projects
default_project_limit = 1  # initial ordinary-task cap for new projects
state_dir = "~/.local/state/gpuq"
poll_seconds = 10
default_reserve_mb = 1024
default_stable_samples = 3
exclusive_max_used_mb = 768
exclusive_max_utilization = 5
nvidia_smi = "nvidia-smi"

# 每个参数独立成一个数组元素。支持 {title}、{message}、{job_id}。
# notify_command = ["notify-send", "{title}", "{message}"]

# Optional local SSH profile. Both hosts need compatible gpuq versions.
# [remotes.train]
# host = "user@gpu-server"
# command = ["~/.local/bin/gpuq"]
# work_dir = "~/.local/share/gpuq/workspaces"
# python = "/opt/conda/envs/train/bin/python"
# requirements = "requirements.lock"  # optional self-contained hashed pip lock
# config = "~/.config/gpuq/config.toml"
# state_dir = "~/.local/state/gpuq"
# cwd = "/srv/project"  # --no-sync only

# Optional shared pool. See docs/cluster_usage.md / .en.md for three-member etcd setup.
# [cluster]
# node_id = "a"  # default hostname; unique, persistent identity
# namespace = "training"  # default "default"; identical on all pool nodes
# endpoints = ["https://a.internal:2379", "https://b.internal:2379", "https://w.internal:2379"]
# work_dir = "~/.local/share/gpuq/clusters/training"  # default derived from namespace
# lease_seconds = 15  # minimum 10
# python = "python3"
# requirements = "requirements.lock"  # optional snapshot-relative hashed lock
# ca = "~/.config/gpuq/ca.pem"
# cert = "~/.config/gpuq/client.pem"
# key = "~/.config/gpuq/client-key.pem"
# token = "etcd-auth-token"  # optional; never commit real credentials
# [cluster.nodes]
# a = "local"
# b = "train"  # SSH profile above; remote cluster.node_id must be b
# Global policy is initialized once with gpuq cluster init, not from [gpuq] caps.
# Node-loss retry policy is also set by cluster init (persisted in etcd):
# --failover-after-seconds 3600 --failover-when-idle --max-failover-retries 1
# At-least-once: a disconnected old training process may still run.
# Set --max-failover-retries 0 at initialization if duplicates are unacceptable.

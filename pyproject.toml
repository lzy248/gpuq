[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-gpuq"
version = "0.3.0"
description = "A personal opportunistic GPU job queue for unmanaged shared servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Liu Zeyang"}]
keywords = ["gpu", "cuda", "scheduler", "queue", "nvidia", "machine-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/lzy248/gpuq"
Documentation = "https://github.com/lzy248/gpuq#readme"
Issues = "https://github.com/lzy248/gpuq/issues"
Changelog = "https://github.com/lzy248/gpuq/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff==0.16.6"]
binary = ["pyinstaller>=6.8"]

[project.scripts]
gpuq = "gpuq.cli:main"
gpuqd = "gpuq.cli:daemon_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
required-version = "==0.16.6"
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the project's original checks explicit as Ruff's defaults evolve.
select = ["E4", "E7", "E9", "F"]
